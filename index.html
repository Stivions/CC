<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tarjeta MWCMD</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: #0a0a15;
            color: #cfd3dc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        .title {
            font-size: 2.8rem;
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #7b75d6;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            background: rgba(15, 15, 25, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #7b75d6;
            box-shadow: 0 0 30px rgba(123, 117, 214, 0.3);
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        .card-preview {
            flex: 1;
            min-width: 300px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid rgba(123, 117, 214, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .card-chip {
            width: 50px;
            height: 36px;
            background: linear-gradient(135deg, #e6c86e 0%, #bf9738 100%);
            border-radius: 8px;
            border: 1px solid #8a6e18;
        }

        .card-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }

        .card-number {
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #fff;
            margin: 20px 0;
            min-height: 50px;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 1.4rem;
            color: #fff;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 1.3rem;
            color: #cfd3dc;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.3rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            font-family: 'VT323', monospace;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #7b75d6;
            box-shadow: 0 0 10px rgba(123, 117, 214, 0.3);
        }

        .form-input.error {
            border-color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .error-message {
            color: #ff4444;
            font-size: 1.1rem;
            margin-top: 5px;
            display: none;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            font-size: 1.4rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #7b75d6;
            color: white;
        }

        .btn-primary:hover {
            background: #6a65c4;
            box-shadow: 0 0 15px rgba(123, 117, 214, 0.5);
        }

        .btn-secondary {
            background: #2a402a;
            color: white;
            border: 2px solid #75d675;
        }

        .btn-secondary:hover {
            background: #75d675;
            color: #000;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 1rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 21, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            font-size: 2.5rem;
            color: #00f2ff;
            margin-bottom: 30px;
        }

        .success-message {
            font-size: 2rem;
            color: #75d675;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">MWCMD - REGISTRO DE TARJETA</h1>
        <p class="subtitle">Complete los datos de su tarjeta de crédito</p>
    </div>

    <div class="container">
        <div class="card-preview">
            <div class="card-header">
                <div class="card-chip"></div>
                <div class="card-brand" id="cardBrand">VISA</div>
            </div>
            
            <div class="card-number" id="cardNumberDisplay">
                #### #### #### ####
            </div>
            
            <div class="card-details">
                <div class="detail-group">
                    <span class="detail-label">Titular</span>
                    <span class="detail-value">USUARIO</span>
                </div>
                <div class="detail-group">
                    <span class="detail-label">Vence</span>
                    <span class="detail-value" id="cardDateDisplay">MM/AA</span>
                </div>
            </div>
        </div>

        <div class="form-section">
            <form id="cardForm">
                <div class="form-group">
                    <label class="form-label">Número de Tarjeta</label>
                    <input 
                        type="text" 
                        id="cardNumberInput" 
                        class="form-input" 
                        placeholder="0000 0000 0000 0000"
                        maxlength="19"
                        autocomplete="off"
                        data-lpignore="true"
                    >
                    <div class="error-message" id="cardNumberError">
                        Número de tarjeta inválido
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha de Vencimiento</label>
                    <input 
                        type="text" 
                        id="cardDateInput" 
                        class="form-input" 
                        placeholder="MM/AA"
                        maxlength="5"
                        autocomplete="off"
                        data-lpignore="true"
                    >
                    <div class="error-message" id="cardDateError">
                        Fecha inválida o expirada
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        <span>💳</span> ASOCIAR TARJETA
                    </button>
                    <button type="button" class="btn btn-secondary" id="updateCCBtn">
                        <span>🔄</span> ACTUALIZAR CC
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        MWCMD © 2024 - Todos los derechos reservados
    </div>

    <div class="loading-overlay" id="loadingScreen">
        <div class="loading-text">PROCESANDO...</div>
        <div class="success-message" id="successMessage">¡TARJETA ASOCIADA EXITOSAMENTE!</div>
    </div>

    <script>
        // Referencias a elementos del DOM
        const cardNumberInput = document.getElementById('cardNumberInput');
        const cardDateInput = document.getElementById('cardDateInput');
        const cardNumberDisplay = document.getElementById('cardNumberDisplay');
        const cardDateDisplay = document.getElementById('cardDateDisplay');
        const cardBrand = document.getElementById('cardBrand');
        const cardForm = document.getElementById('cardForm');
        const loadingScreen = document.getElementById('loadingScreen');
        const successMessage = document.getElementById('successMessage');
        const updateCCBtn = document.getElementById('updateCCBtn');

        // Configuración para evitar autocompletado
        cardNumberInput.setAttribute('autocomplete', 'off');
        cardDateInput.setAttribute('autocomplete', 'off');
        cardForm.setAttribute('autocomplete', 'off');

        // Patrones para detectar tipo de tarjeta
        const cardPatterns = {
            visa: /^4/,
            mastercard: /^5[1-5]/,
            amex: /^3[47]/,
            discover: /^6(?:011|5)/,
            diners: /^3(?:0[0-5]|[68])/
        };

        // Algoritmo de Luhn para validar tarjeta
        function validateLuhn(cardNumber) {
            const cleaned = cardNumber.replace(/\D/g, '');
            let sum = 0;
            let isEven = false;

            for (let i = cleaned.length - 1; i >= 0; i--) {
                let digit = parseInt(cleaned.charAt(i), 10);

                if (isEven) {
                    digit *= 2;
                    if (digit > 9) {
                        digit -= 9;
                    }
                }

                sum += digit;
                isEven = !isEven;
            }

            return sum % 10 === 0;
        }

        // Validar fecha de vencimiento
        function validateExpiryDate(dateString) {
            if (!dateString || dateString.length < 5) {
                return false;
            }

            const [month, year] = dateString.split('/').map(num => parseInt(num, 10));
            
            if (!month || !year || month < 1 || month > 12) {
                return false;
            }

            const currentDate = new Date();
            const currentYear = currentDate.getFullYear() % 100;
            const currentMonth = currentDate.getMonth() + 1;

            if (year < currentYear) {
                return false;
            }

            if (year === currentYear && month < currentMonth) {
                return false;
            }

            return true;
        }

        // Formatear número de tarjeta
        function formatCardNumber(value) {
            const cleaned = value.replace(/\D/g, '');
            const chunks = [];
            
            for (let i = 0; i < cleaned.length; i += 4) {
                chunks.push(cleaned.substring(i, i + 4));
            }
            
            return chunks.join(' ');
        }

        // Detectar tipo de tarjeta
        function detectCardType(number) {
            const cleaned = number.replace(/\D/g, '');
            
            for (const [type, pattern] of Object.entries(cardPatterns)) {
                if (pattern.test(cleaned)) {
                    return type.toUpperCase();
                }
            }
            
            return 'VISA'; // Por defecto
        }

        // Actualizar vista previa de la tarjeta
        function updateCardPreview() {
            const number = cardNumberInput.value;
            const date = cardDateInput.value;
            
            // Actualizar número
            if (number) {
                cardNumberDisplay.textContent = formatCardNumber(number);
                
                // Detectar y actualizar tipo de tarjeta
                const type = detectCardType(number);
                cardBrand.textContent = type;
                
                // Cambiar color según tipo
                switch(type) {
                    case 'VISA': cardBrand.style.color = '#1a1f71'; break;
                    case 'MASTERCARD': cardBrand.style.color = '#eb001b'; break;
                    case 'AMEX': cardBrand.style.color = '#2e77bc'; break;
                    default: cardBrand.style.color = '#fff';
                }
            } else {
                cardNumberDisplay.textContent = '#### #### #### ####';
                cardBrand.textContent = 'VISA';
                cardBrand.style.color = '#fff';
            }
            
            // Actualizar fecha
            if (date) {
                cardDateDisplay.textContent = date;
            } else {
                cardDateDisplay.textContent = 'MM/AA';
            }
        }

        // Eventos de entrada
        cardNumberInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            // Limitar a 16 dígitos (19 con espacios)
            if (value.length > 16) {
                value = value.substring(0, 16);
            }
            
            // Formatear con espacios cada 4 dígitos
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formatted += ' ';
                }
                formatted += value[i];
            }
            
            e.target.value = formatted;
            updateCardPreview();
            
            // Limpiar error
            document.getElementById('cardNumberError').style.display = 'none';
            e.target.classList.remove('error');
        });

        cardDateInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            
            if (value.length > 5) {
                value = value.substring(0, 5);
            }
            
            e.target.value = value;
            updateCardPreview();
            
            // Limpiar error
            document.getElementById('cardDateError').style.display = 'none';
            e.target.classList.remove('error');
        });

        // Botón de actualizar CC
        updateCCBtn.addEventListener('click', function() {
            window.open('https://rogarden.gg/', '_blank');
        });

        // Envío del formulario
        cardForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            // Validar número de tarjeta
            const cardNumber = cardNumberInput.value.replace(/\D/g, '');
            const cardNumberError = document.getElementById('cardNumberError');
            
            if (cardNumber.length < 13 || cardNumber.length > 19) {
                cardNumberError.textContent = 'El número de tarjeta debe tener entre 13 y 19 dígitos';
                cardNumberError.style.display = 'block';
                cardNumberInput.classList.add('error');
                isValid = false;
            } else if (!validateLuhn(cardNumber)) {
                cardNumberError.textContent = 'Número de tarjeta inválido';
                cardNumberError.style.display = 'block';
                cardNumberInput.classList.add('error');
                isValid = false;
            }
            
            // Validar fecha
            const cardDate = cardDateInput.value;
            const cardDateError = document.getElementById('cardDateError');
            
            if (!validateExpiryDate(cardDate)) {
                cardDateError.textContent = 'Fecha inválida o expirada';
                cardDateError.style.display = 'block';
                cardDateInput.classList.add('error');
                isValid = false;
            }
            
            if (isValid) {
                // Mostrar pantalla de carga
                loadingScreen.style.display = 'flex';
                
                // Simular procesamiento
                setTimeout(() => {
                    successMessage.style.display = 'block';
                    
                    // Recargar después de 3 segundos
                    setTimeout(() => {
                        location.reload();
                    }, 3000);
                }, 2000);
            }
        });

        // Inicializar vista previa
        updateCardPreview();
    </script>
</body>
</html>
